name: Deploy Jobs Frontend

on:
  push:
    branches:
      - main

permissions:
  contents: read
concurrency:
  group: jobs-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_API_TOKEN: ${{ secrets.NEXT_PUBLIC_API_TOKEN }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 443
          command_timeout: 30m
          envs: NEXT_PUBLIC_API_BASE_URL,NEXT_PUBLIC_API_TOKEN
          script: |
            set -euo pipefail

            echo "==> Checking deploy directory"
            cd /var/www/dadu-jobs

            echo "==> Pulling latest code"
            git fetch origin main
            git reset --hard origin/main

            echo "==> Writing .env"
            API_BASE_URL="${NEXT_PUBLIC_API_BASE_URL:-https://jobs-api.dadu.edu.et}"
            umask 077
            touch .env
            sed -i '/^NEXT_PUBLIC_API_BASE_URL=/d' .env
            printf 'NEXT_PUBLIC_API_BASE_URL=%s\n' "$API_BASE_URL" >> .env
            if [ -n "${NEXT_PUBLIC_API_TOKEN:-}" ]; then
              sed -i '/^NEXT_PUBLIC_API_TOKEN=/d' .env
              printf 'NEXT_PUBLIC_API_TOKEN=%s\n' "$NEXT_PUBLIC_API_TOKEN" >> .env
            fi

            echo "==> Ensuring docker network"
            docker network inspect jobs-shared-network >/dev/null 2>&1 || \
              docker network create jobs-shared-network

            echo "==> Building and starting containers"
            docker compose up -d --build
            curl --fail --silent --show-error --retry 12 --retry-connrefused --retry-delay 5 http://127.0.0.1:3015/ > /dev/null

            echo "==> Cleaning old images"
            docker image prune -f

            echo "==> Deploy finished"
            docker compose ps

